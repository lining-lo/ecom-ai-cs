<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="150" viewBox="0 0 1200 150"
     role="img" aria-labelledby="title desc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">API 接口</title>
  <desc id="desc">两个核心接口：POST /api/chat 发送消息，GET /api/chat/history 获取历史。</desc>
  <rect width="1200" height="150" rx="20" fill="#0D1117"/>

  <g transform="translate(56 0)">
    <text x="0" y="52" font-size="17" fill="#58A6FF"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">04</text>
    <text x="48" y="96" font-size="40" font-weight="700" fill="#F0F6FC">API 接口</text>
    <text x="0" y="126" font-size="19" fill="#8B949E">POST /api/chat · GET /api/chat/history</text>
    <rect x="0" y="136" width="72" height="4" rx="2" fill="#2F81F7"/>
  </g>

  <g transform="translate(978 53)">
    <rect width="166" height="44" rx="22" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="83" y="27" font-size="17" text-anchor="middle" fill="#E6EDF3"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">REST API</text>
  </g>
</svg>
